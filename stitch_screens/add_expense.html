<style>
        body {
            background-color: #f9f9f9;
            color: #1a1c1c;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom input focus reset */
        input:focus, textarea:focus {
            outline: none;
            box-shadow: none;
        }
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex flex-col min-h-screen bg-background text-on-background max-w-md mx-auto relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 border-b border-outline-variant bg-surface flex items-center px-gutter h-16 w-full z-10 sticky">
<button aria-label="Go back" class="mr-gutter active:opacity-80 transition-colors p-2 -ml-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Add Expense</h1>
</header>
<main class="flex-1 flex flex-col px-container-margin pt-lg pb-xl">
<!-- Numeric Display Section -->
<section class="flex flex-col items-center justify-center py-xl mb-lg">
<span class="font-label-sm text-label-sm text-secondary mb-xs">AMOUNT</span>
<div class="flex items-baseline">
<span class="font-headline-md text-headline-md text-primary mr-1">$</span>
<input class="bg-transparent border-none text-center font-numeric-xl text-numeric-xl p-0 w-full focus:ring-0 text-primary" id="amountInput" placeholder="0.00" readonly="" type="text" value="42.50"/>
</div>
</section>
<!-- Category Grid -->
<section class="mb-xl">
<div class="flex justify-between items-center mb-md">
<h2 class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Category</h2>
<span class="font-label-sm text-label-sm text-primary">View All</span>
</div>
<div class="grid grid-cols-4 gap-sm">
<!-- Dining -->
<button class="category-btn flex flex-col items-center justify-center p-md bg-surface-container-lowest border border-black rounded-lg transition-all duration-200" data-active="true">
<span class="material-symbols-outlined text-primary mb-2">restaurant</span>
<span class="font-label-sm text-label-sm">Dining</span>
</button>
<!-- Shopping -->
<button class="category-btn flex flex-col items-center justify-center p-md bg-surface-container-low border border-outline-variant rounded-lg transition-all duration-200 hover:border-primary">
<span class="material-symbols-outlined text-secondary mb-2">shopping_bag</span>
<span class="font-label-sm text-label-sm">Shopping</span>
</button>
<!-- Transport -->
<button class="category-btn flex flex-col items-center justify-center p-md bg-surface-container-low border border-outline-variant rounded-lg transition-all duration-200 hover:border-primary">
<span class="material-symbols-outlined text-secondary mb-2">commute</span>
<span class="font-label-sm text-label-sm">Travel</span>
</button>
<!-- Groceries -->
<button class="category-btn flex flex-col items-center justify-center p-md bg-surface-container-low border border-outline-variant rounded-lg transition-all duration-200 hover:border-primary">
<span class="material-symbols-outlined text-secondary mb-2">local_grocery_store</span>
<span class="font-label-sm text-label-sm">Groceries</span>
</button>
<!-- Bills -->
<button class="category-btn flex flex-col items-center justify-center p-md bg-surface-container-low border border-outline-variant rounded-lg transition-all duration-200 hover:border-primary">
<span class="material-symbols-outlined text-secondary mb-2">receipt_long</span>
<span class="font-label-sm text-label-sm">Bills</span>
</button>
<!-- Health -->
<button class="category-btn flex flex-col items-center justify-center p-md bg-surface-container-low border border-outline-variant rounded-lg transition-all duration-200 hover:border-primary">
<span class="material-symbols-outlined text-secondary mb-2">medical_services</span>
<span class="font-label-sm text-label-sm">Health</span>
</button>
<!-- Entertainment -->
<button class="category-btn flex flex-col items-center justify-center p-md bg-surface-container-low border border-outline-variant rounded-lg transition-all duration-200 hover:border-primary">
<span class="material-symbols-outlined text-secondary mb-2">theater_comedy</span>
<span class="font-label-sm text-label-sm">Fun</span>
</button>
<!-- More -->
<button class="category-btn flex flex-col items-center justify-center p-md bg-surface-container-low border border-outline-variant rounded-lg transition-all duration-200 hover:border-primary">
<span class="material-symbols-outlined text-secondary mb-2">more_horiz</span>
<span class="font-label-sm text-label-sm">Others</span>
</button>
</div>
</section>
<!-- Date & Note Fields -->
<section class="space-y-lg mb-xl">
<div class="relative group">
<label class="block font-label-sm text-label-sm text-secondary mb-xs">DATE</label>
<div class="flex items-center border-b border-outline-variant py-sm group-focus-within:border-primary transition-colors">
<span class="material-symbols-outlined text-secondary mr-sm">calendar_today</span>
<input class="bg-transparent border-none p-0 w-full font-body-md text-body-md text-primary" readonly="" type="text" value="Today, 14 Oct 2023"/>
</div>
</div>
<div class="relative group">
<label class="block font-label-sm text-label-sm text-secondary mb-xs">NOTE</label>
<div class="flex items-start border border-outline-variant p-md rounded-lg group-focus-within:border-primary transition-colors bg-white">
<span class="material-symbols-outlined text-secondary mr-sm mt-0.5">notes</span>
<textarea class="bg-transparent border-none p-0 w-full font-body-md text-body-md text-primary resize-none placeholder:text-outline" placeholder="Add a description..." rows="2"></textarea>
</div>
</div>
</section>
<!-- Keypad Interaction (Conceptual for entry) -->
<section class="mt-auto">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-lg rounded-lg shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
                Save Expense
            </button>
</section>
</main>
<!-- Bottom Navigation Shell (Excluded as per Task-Focused rule, but present in JSON - Suppressing for Focused Intent) -->
<!-- The "Success/Confirmation" flow or Add screen implies task focus, suppressing global nav -->
<script>
        // Micro-interactions for category selection
        const categoryButtons = document.querySelectorAll('.category-btn');
        
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Reset all
                categoryButtons.forEach(b => {
                    b.classList.remove('bg-surface-container-lowest', 'border-black');
                    b.classList.add('bg-surface-container-low', 'border-outline-variant');
                    const icon = b.querySelector('.material-symbols-outlined');
                    if(icon) icon.classList.replace('text-primary', 'text-secondary');
                });
                
                // Set active
                btn.classList.add('bg-surface-container-lowest', 'border-black');
                btn.classList.remove('bg-surface-container-low', 'border-outline-variant');
                const icon = btn.querySelector('.material-symbols-outlined');
                if(icon) icon.classList.replace('text-secondary', 'text-primary');
            });
        });

        // Simple animation on amount click
        const amountInput = document.getElementById('amountInput');
        amountInput.addEventListener('click', () => {
            amountInput.classList.add('scale-105');
            setTimeout(() => amountInput.classList.remove('scale-105'), 150);
        });
    </script>
</body></html>
