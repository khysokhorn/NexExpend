name: Build APK and send to Telegram

on:
  push:
    branches: [ dev ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Optional: the on-device LLM model (.litertlm) is too large to commit to git
      # (see .gitignore) and is normally staged from a local `models/` directory by
      # the `copyLocalModel` Gradle task (app/build.gradle.kts) before packaging.
      # If a MODEL_URL secret is configured, fetch the model here so CI builds bundle
      # it too. If it's not set, the build still succeeds — LocalLlmService falls
      # back to regex-based parsing at runtime when no model is bundled.
      - name: Fetch on-device model (optional)
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        if: env.MODEL_URL != ''
        run: |
          mkdir -p models
          curl -fL "$MODEL_URL" -o "models/granite-4.0-350m_q8_ekv1280.litertlm"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: locate_apk
        run: |
          apk_path=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No APK found in app/build/outputs/apk" >&2
            exit 1
          fi
          echo "Found APK: $apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexexpend-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.locate_apk.outputs.apk_path }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID secrets are not set — skipping Telegram upload." >&2
            exit 1
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${APK_PATH}" \
            -F caption="NexExpend debug build — ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
